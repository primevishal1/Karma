<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semester 1 - PharmaTutorHub</title>

<style>

/* HEADER (your same style) */
header { background:black; color:white; padding:15px 20px; position: sticky; top: 0; z-index: 1000; }
.header-container { display:flex; align-items:center; justify-content:space-between; max-width: 1200px; margin: 0 auto; gap:15px; }
.logo-section { display:flex; align-items:center; gap:15px; }
.logo { width:55px; height:55px; border-radius:50%; object-fit:cover; border: 3px solid #00cfcf; }
.title-area h1 { margin:0; font-size:22px; text-transform: uppercase; letter-spacing: 1.5px; }
.slogan { font-size:13px; color:#00cfcf; display: block; margin-top: 3px; }

/* PAGE STYLE */
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f6f8;
}

/* SEMESTER TITLE */
.semester-title{
    text-align:center;
    margin:25px 0 10px 0;
    font-size:24px;
}

/* BUTTON GRID */
.subject-grid{
    max-width:900px;
    margin:20px auto;
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:center;
}

/* SUBJECT BUTTON */
.subject-btn{
    background:white;
    border:2px solid #00cfcf;
    padding:10px 14px;
    font-size:14px;
    cursor:pointer;
    text-decoration:none;
    color:black;
    transition:0.2s;
}

.subject-btn:hover{
    background:#00cfcf;
    color:white;
}

</style>
</head>

<body>

<header>
    <div class="header-container">
        <div class="logo-section">
            <img src="01.png" alt="PharmaTutorHub Logo" class="logo"> 
            <div class="title-area">
                <h1>PharmaTutorHub</h1>
                <span class="slogan">Your Support = PharmaTutorHub ❤️</span>
            </div>
        </div>
    </div>
</header>

<h2 class="semester-title">Semester 1</h2>

<div class="subject-grid">

<a href="#" class="subject-btn">Human Anatomy and Physiology</a>
<a href="#" class="subject-btn">Pharmaceutical Analysis I</a>
<a href="#" class="subject-btn">Pharmaceutics I</a>
<a href="#" class="subject-btn">Pharmaceutical Inorganic Chemistry</a>
<a href="#" class="subject-btn">Communication Skills</a>
<a href="#" class="subject-btn">Remedial Biology</a>
<a href="#" class="subject-btn">Remedial Mathematics</a>

</div>

</body>
</html>
